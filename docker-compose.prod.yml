services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      PORT: "3000"
      NODE_ENV: production
      CORS_ORIGIN: "https://${DOMAIN}"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-finance_session}
      SESSION_EXPIRY_DAYS: ${SESSION_EXPIRY_DAYS:-7}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - internal

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "https://${DOMAIN}"
    container_name: finance-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: finance-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Uncomment below if using Let's Encrypt (domain-based SSL):
      # - ./certbot/www:/var/www/certbot:ro
      # - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - client
      - server
    networks:
      - internal

  # Uncomment if using Let's Encrypt (domain-based SSL):
  # certbot:
  #   image: certbot/certbot
  #   container_name: finance-certbot
  #   volumes:
  #     - ./certbot/www:/var/www/certbot
  #     - ./certbot/conf:/etc/letsencrypt
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   networks:
  #     - internal

volumes:
  postgres_data:
    driver: local

networks:
  internal:
    driver: bridge
