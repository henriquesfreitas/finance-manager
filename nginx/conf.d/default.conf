# This file is overwritten by scripts/setup-ssl-selfsigned.sh during deployment.
# Default: HTTP-only proxy for initial setup / pre-SSL.

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        set $backend_server server:3000;
        proxy_pass http://$backend_server;
        proxy_set_header Host $host;
    }

    location /api/ {
        set $backend_server server:3000;
        proxy_pass http://$backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $backend_client client:80;
        proxy_pass http://$backend_client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
